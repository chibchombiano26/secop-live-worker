name: Deploy SECOP

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Verify the production inventory or deploy a compatible release
        default: plan
        options: [plan, deploy, check]

permissions:
  contents: read

concurrency:
  group: secop-production-infrastructure
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the existing deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - run: npm ci --prefix worker
      - run: npm run test:infra
      - run: npm --prefix worker run typecheck
      - run: npm --prefix worker test
      - run: worker/node_modules/.bin/tsc -p ocr/tsconfig.json
      - run: python3 -m unittest discover -s ocr/container/tests -p 'test_*.py'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: infra/.state/ocr-build-cache.json
          key: secop-public-safe-ocr-${{ github.run_id }}
          restore-keys: secop-public-safe-ocr-
      - name: Reconcile and verify the existing production resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPERATION: ${{ inputs.operation }}
        run: node infra/run.mjs "$OPERATION"
